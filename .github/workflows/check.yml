# Prüft jeden Pull Request (und jeden Push auf einen anderen Branch als main):
# Typen, Lint, alle Tests und der Vite-Build. Nur ein grüner PR wird gemergt.
name: Prüfung

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
