# Web-Demo: baut das Spiel bei jedem Push auf main und veröffentlicht es auf GitHub Pages
# unter https://mrfloyd84.github.io/iron-vault/ (spielbar ohne Installation).
name: Web-Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build für den Unterpfad /iron-vault/
        run: npx vite build
        env:
          IRON_VAULT_BASE: /iron-vault/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
